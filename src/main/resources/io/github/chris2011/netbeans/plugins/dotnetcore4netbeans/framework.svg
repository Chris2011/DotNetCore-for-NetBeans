<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Framework foundation/base -->
  <rect x="1" y="12" width="14" height="3" fill="#4a4a4a" rx="1"/>

  <!-- Framework pillars -->
  <rect x="3" y="6" width="2" height="6" fill="#666"/>
  <rect x="7" y="4" width="2" height="8" fill="#666"/>
  <rect x="11" y="6" width="2" height="6" fill="#666"/>

  <!-- Framework roof/top -->
  <rect x="2" y="3" width="12" height="2" fill="#4a4a4a" rx="1"/>

  <!-- Framework connection lines -->
  <line x1="4" y1="6" x2="8" y2="6" stroke="#888" stroke-width="1"/>
  <line x1="9" y1="6" x2="12" y2="6" stroke="#888" stroke-width="1"/>

  <!-- .NET style accent -->
  <circle cx="8" cy="8" r="2" fill="none" stroke="#0078d4" stroke-width="1.5" opacity="0.7"/>
  <rect x="7" y="7" width="2" height="2" fill="#0078d4" opacity="0.4"/>

  <!-- Small highlights -->
  <rect x="3" y="6" width="2" height="1" fill="#999"/>
  <rect x="11" y="6" width="2" height="1" fill="#999"/>
</svg>