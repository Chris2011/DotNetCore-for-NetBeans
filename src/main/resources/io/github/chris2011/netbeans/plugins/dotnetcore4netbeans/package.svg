<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Package box background -->
  <rect x="2" y="4" width="12" height="10" fill="#e8e8e8" stroke="#666" stroke-width="1" rx="1"/>

  <!-- Package lid -->
  <rect x="2" y="2" width="12" height="4" fill="#f0f0f0" stroke="#666" stroke-width="1" rx="1"/>

  <!-- Package opening seam -->
  <line x1="8" y1="2" x2="8" y2="6" stroke="#999" stroke-width="1"/>
  <line x1="2" y1="4" x2="14" y2="4" stroke="#999" stroke-width="1"/>

  <!-- Package label/tape -->
  <rect x="4" y="7" width="8" height="2" fill="#d4af37" opacity="0.8" rx="0.5"/>

  <!-- Small highlight -->
  <rect x="3" y="3" width="2" height="1" fill="#fff" opacity="0.6"/>
</svg>